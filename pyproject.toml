[project]
name = "servicewright"
version = "0.5.0"
description = "Batteries-optional microservice runtime: lifecycle, observability, warmup and gRPC/FastAPI transport entities to build services fast"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alex Shalaev", email = "shalaevad.alexey@gmail.com" }]
keywords = ["microservices", "runtime", "lifecycle", "asyncio", "fastapi", "grpc", "observability", "graceful-shutdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/bedrock-python/servicewright"
Documentation = "https://bedrock-python.github.io/servicewright/"
Changelog = "https://github.com/bedrock-python/servicewright/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/bedrock-python/servicewright/issues"

[project.optional-dependencies]
observability = [
    "opentelemetry-sdk>=1.39.1",
    # The gRPC OTLP exporter specifically: the `opentelemetry-exporter-otlp`
    # meta-package additionally pulls the HTTP exporter (and requests) into
    # every install, and the tracing sink only ever imports the gRPC one.
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.1",
    "structlog>=25.5.0,<27.0.0",
]
# Request tracing for the FastAPI entrypoint (the instrumentor is imported
# lazily, so it stays optional rather than weighing down [observability]).
fastapi-tracing = [
    "servicewright[fastapi,observability]",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
]
metrics = [
    "prometheus-client>=0.24.0,<1.0.0",
]
sentry = [
    "sentry-sdk>=2.0.0,<3.0.0",
]
redis = [
    "redis>=4.2.0",
]
postgres = [
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
]
kafka = [
    "aiokafka>=0.10.0",
]
fastapi = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "deadline-budget>=0.1.0,<1.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<9.0.0",
]
grpc = [
    "grpc-server-kit[reflection,channelz,health]>=0.1.0,<0.2",
]
litestar = [
    "litestar>=2.12.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]
apscheduler4 = [
    "apscheduler>=4.0.0a5,<5",
]
apscheduler3 = [
    "apscheduler>=3.10,<4",
]
dishka = [
    "dishka>=1.4.0",
]
# The uvloop event loop, picked by ``run_sync(loop="auto" | "uvloop")``. The
# [fastapi] and [litestar] extras already carry it through uvicorn[standard];
# this is for services that run on neither.
uvloop = [
    "uvloop>=0.21.0",
]
# Everything except [apscheduler3], which is the same distribution as
# [apscheduler4] with an incompatible major and can never coexist with it.
all = [
    "servicewright[observability,metrics,sentry,redis,postgres,kafka,fastapi,fastapi-tracing,grpc,litestar,apscheduler4,dishka,uvloop]",
]

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-lazy-fixtures>=1.1.1",
    "freezegun>=1.5.5",
    "prometheus-client>=0.24.0,<1.0.0",
    "sentry-sdk>=2.0.0,<3.0.0",
    "opentelemetry-sdk>=1.39.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "structlog>=25.5.0,<27.0.0",
    "httpx>=0.27.0,<1.0.0",
    "redis>=4.2.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "aiokafka>=0.10.0",
    "grpc-server-kit[reflection,channelz,health]>=0.1.0,<0.2",
    "dishka>=1.4.0",
    "litestar>=2.12.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "uvloop>=0.21.0",
]
docs = [
    "zensical>=0.0.37",
    "mkdocstrings-python>=2.0.3",
]
dev = [
    "ruff>=0.15.1",
    "mypy>=1.19.1",
    "import-linter>=2.3",
    "pre-commit>=4.5.1",
    { include-group = "test" },
]

[tool.uv]
link-mode = "copy"

# APScheduler 3.x and 4.x are the same distribution with incompatible majors, so
# the [apscheduler3] and [apscheduler4] adapters can never coexist in one
# environment. Declaring them as conflicting lets uv lock them in separate forks
# instead of failing to resolve a single environment that pulls both.
conflicts = [
    [
        { extra = "apscheduler3" },
        { extra = "apscheduler4" },
    ],
    # [all] bundles apscheduler4, so it inherits the same conflict.
    [
        { extra = "apscheduler3" },
        { extra = "all" },
    ],
]

[tool.hatch.build.targets.wheel]
packages = ["servicewright"]

[tool.hatch.build.targets.sdist]
include = ["/servicewright", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.mypy]
python_version = "3.12"
files = ["servicewright"]
mypy_path = ["."]
check_untyped_defs = true
disallow_untyped_defs = true
implicit_reexport = false
ignore_missing_imports = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "opentelemetry.*",
    "sentry_sdk.*",
    "prometheus_client.*",
    "redis.*",
    "aiokafka.*",
    "sqlalchemy.*",
    "grpc.*",
    "grpc_health.*",
    "apscheduler.*",
    "fastapi.*",
    "starlette.*",
    "uvicorn.*",
    "prometheus_fastapi_instrumentator.*",
    "dishka.*",
    "litestar.*",
]
ignore_missing_imports = true
follow_imports = "skip"


[tool.importlinter]
root_package = "servicewright"
include_external_packages = true

# The layering the whole design rests on: deleting adapters/ must leave core/
# importable. Contracts are checked by `make check` and by the CI lint job.
[[tool.importlinter.contracts]]
name = "Core never depends on adapters"
type = "forbidden"
source_modules = ["servicewright.core"]
forbidden_modules = ["servicewright.adapters"]

[[tool.importlinter.contracts]]
name = "Core is stdlib-only"
type = "forbidden"
source_modules = ["servicewright.core"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "uvicorn",
    "litestar",
    "grpc",
    "grpc_server_kit",
    "apscheduler",
    "dishka",
    "structlog",
    "opentelemetry",
    "sentry_sdk",
    "prometheus_client",
    "sqlalchemy",
    "redis",
    "aiokafka",
    "httpx",
    "pydantic",
    "uvloop",
]

[[tool.importlinter.contracts]]
name = "Adapters never depend on each other"
type = "independence"
modules = [
    "servicewright.adapters.fastapi",
    "servicewright.adapters.grpc",
    "servicewright.adapters.litestar",
    "servicewright.adapters.apscheduler3",
    "servicewright.adapters.apscheduler4",
    "servicewright.adapters.dishka",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "N", "S", "C4", "DTZ", "SIM", "TRY", "PERF", "RUF", "UP", "ANN", "T20", "PTH", "PLC", "PLE", "PLW"]
ignore = ["TRY003", "S101", "ANN401", "RUF012", "S104", "S105", "S106", "ANN204", "DTZ", "ANN", "N802", "PERF401", "SIM105", "S607", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Runnable examples narrate what they do on stdout; print() is the point.
"examples/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: mark a test as a unit test.",
    "integration: mark a test as an integration test.",
]
filterwarnings = [
    "ignore:coroutine.*was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["servicewright"]
omit = [
    "tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    '@(typing\.)?overload',
    "raise NotImplementedError",
    '\.\.\.',
]
