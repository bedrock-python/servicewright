[project]
site_name = "servicewright"
site_description = "Batteries-optional microservice runtime: lifecycle, observability, warmup and gRPC/FastAPI transport entities to build services fast"
site_author = "Alex Shalaev"
repo_name = "bedrock-python/servicewright"
repo_url = "https://github.com/bedrock-python/servicewright"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; 2026 Alex Shalaev"
docs_dir = "docs"
site_dir = "site"

nav = [
    { "Home" = "index.md" },
    { "Getting started" = [
        { "Installation" = "getting-started/installation.md" },
        { "Your first service" = "getting-started/first-service.md" },
        { "Tutorial" = "getting-started/tutorial.md" },
    ] },
    { "Concepts" = [
        { "Architecture" = "concepts/architecture.md" },
        { "Lifecycle" = "concepts/lifecycle.md" },
        { "Entrypoints" = "concepts/entrypoints.md" },
        { "Dependency injection" = "concepts/dependency-injection.md" },
        { "Settings" = "concepts/settings.md" },
        { "Errors" = "concepts/errors.md" },
        { "Request context" = "concepts/context.md" },
        { "Health checks" = "concepts/health.md" },
        { "Warmup" = "concepts/warmup.md" },
        { "Observability" = "concepts/observability.md" },
        { "Plugins" = "concepts/plugins.md" },
    ] },
    { "Adapters" = [
        { "Overview" = "adapters/overview.md" },
        { "FastAPI" = "adapters/fastapi.md" },
        { "Litestar" = "adapters/litestar.md" },
        { "gRPC" = "adapters/grpc.md" },
        { "Scheduler" = "adapters/scheduler.md" },
        { "Daemon and one-shot" = "adapters/daemon-and-oneshot.md" },
        { "dishka" = "adapters/dishka.md" },
        { "Observability backends" = "adapters/observability-backends.md" },
        { "Infrastructure" = "adapters/infrastructure.md" },
    ] },
    { "Blueprints" = [
        { "Project layout" = "blueprints/project-layout.md" },
        { "HTTP API service" = "blueprints/http-api.md" },
        { "gRPC service" = "blueprints/grpc-service.md" },
        { "Background worker" = "blueprints/worker.md" },
        { "Batch job" = "blueprints/batch-job.md" },
    ] },
    { "Guides" = [
        { "Writing an entrypoint" = "guides/custom-entrypoint.md" },
        { "Testing" = "guides/testing.md" },
    ] },
    { "Operations" = [
        { "Kubernetes" = "operations/kubernetes.md" },
        { "Production checklist" = "operations/checklist.md" },
        { "Runbooks" = "operations/runbooks.md" },
    ] },
    { "API Reference" = [
        { "servicewright" = "reference/servicewright.md" },
        { "Adapters" = "reference/adapters.md" },
        { "Testing" = "reference/testing.md" },
    ] },
    { "Changelog" = "changelog.md" },
]

[project.theme]
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.share",
    "search.suggest",
    "toc.follow",
    "toc.integrate",
]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
heading_level = 3
